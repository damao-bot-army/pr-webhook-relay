name: Bug report
description: Something in the relay does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste secrets, routine URLs or Worker URLs. Report security problems privately via SECURITY.md.
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Signature check
        - Event filtering
        - Forwarding
        - Deployment / docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Event type, action and the HTTP status the Worker returned.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or deployed version.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
    validations:
      required: false
